services:
  postgres:
    image: postgres:16
    container_name: estoque-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: estoque_db
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: lucas
    ports:
      - "5433:5432"
    volumes:
      - estoque_pgdata:/var/lib/postgresql/data

volumes:
  estoque_pgdata: